<head>

<link rel="icon" type="image/png" href="photo_2026-02-13_00-21-40-fotor-2026021312851.png">
<link rel="shortcut icon" href="photo_2026-02-13_00-21-40-fotor-2026021312851.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --bg:#000;
  --border:#1f1f1f;
  --text:#fff;
  --muted:#aaa;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:radial-gradient(circle at top,#111,#000 65%);
  color:#fff;
}

/* NAVBAR */
header{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:95px;
  padding:0 32px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #1f1f1f;
  z-index:1000;
}

.nav-left{
  display:flex;
  align-items:center;
  gap:22px;
}

.nav-left a{
  color:#aaa;
  font-size:19px;
  font-weight:600;
  cursor:pointer;
  text-decoration:none;
}

.nav-left a:hover{
  color:#fff;
}

.nav-logo{
  height:44px;
  cursor:pointer;
}

.logo{
  text-align:center;
  font-size:24px;
  font-weight:bold;
  letter-spacing:3px;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:26px;
}

.socials{
  display:flex;
  gap:22px;
}

.socials a{
  color:#fff;
  font-size:22px;
}

/* HOME */
#home{
  min-height:100vh;
  padding-top:140px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.home-inner{
  max-width:900px;
}

.home-inner h1{
  font-size:52px;
  margin-bottom:12px;
}

.home-inner p{
  color:#aaa;
  font-size:18px;
}

.video-box{
  margin:35px auto 0;
  max-width:880px;
  aspect-ratio:16/9;
  border-radius:26px;
  overflow:hidden;
  border:1px solid #1f1f1f;
  box-shadow:0 0 25px rgba(255,255,255,.15);
}

.video-box iframe{
  width:100%;
  height:100%;
  border:none;
}

/* SECTION */
.section{
  max-width:1150px;
  margin:auto;
  padding:100px 20px;
}

.section h2{
  text-align:center;
  margin-bottom:40px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

/* 🔥 WHITE GLOW CARD */
.card{
  background:linear-gradient(145deg,#0a0a0a,#000);
  border:1px solid #1f1f1f;
  padding:25px;
  border-radius:20px;
  cursor:pointer;
  transition:all .3s ease;
}

.card:hover{
  border-color:#fff;
  box-shadow:
    0 0 15px rgba(255,255,255,0.8),
    0 0 30px rgba(255,255,255,0.4),
    inset 0 0 10px rgba(255,255,255,0.2);
  transform:translateY(-6px);
}

.card p{
  color:#aaa;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.modal.active{
  display:flex;
}

.modal-box{
  width:92%;
  max-width:480px;
  background:#000;
  border:1px solid #1f1f1f;
  border-radius:24px;
  padding:30px;
  text-align:center;
  position:relative;
}

.close{
  position:absolute;
  top:14px;
  right:18px;
  font-size:22px;
  color:#aaa;
  cursor:pointer;
}

.progress{
  height:10px;
  background:#222;
  border-radius:20px;
  overflow:hidden;
  margin:15px 0;
}

#bar{
  height:100%;
  width:0%;
  background:#fff;
  transition:0.4s;
}

#percent{
  font-size:12px;
  color:#ccc;
}

.step{
  display:block;
  background:#fff;
  color:#000;
  padding:14px;
  margin:10px 0;
  border-radius:18px;
  font-weight:bold;
  text-decoration:none;
}

.step.done{
  background:#fff;
}

.step.done::after{
  content:"✓";
  float:right;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:18px;
  background:#fff;
  font-weight:bold;
  opacity:.4;
}

button.active{
  opacity:1;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:40px;
  border-top:1px solid #1f1f1f;
  color:#666;
}
</style>
</head>

<body>

<header>
  <div class="nav-left">

      <a href="https://www.youtube.com/@PoloX_script" target="_blank"><i class="fab fa-youtube"></i></a>
      <a href="https://www.instagram.com/polo_bro.7p" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://t.me/eventpolo" target="_blank"><i class="fab fa-telegram"></i></a>
      <a href="https://discord.gg/SENING_DISCORD" target="_blank"><i class="fab fa-discord"></i></a>
    </div>
  </div>
</header>

<!-- HOME -->
<section id="home">
  <div class="home-inner">
    <h1>PoloX Scripts Hub</h1>
    <p>Clean, fast and reliable scripts for Mobile & PC.</p>

    <div class="video-box">
      <iframe 
        src="https://www.youtube.com/embed/_jsAY7nEYmo"
        allowfullscreen>
      </iframe>
    </div>

  </div>
</section>

<!-- SCRIPTS -->
<section id="scripts" class="section">
<h2>Scripts</h2>
<div class="grid">
  <div class="card" onclick="openScript99()">
    <h3>99 Nights In The Forest</h3>
    <p>Auto Farm, Admin, ESP</p>
  </div>
</div>
</section>

<!-- KEYS -->
<section id="keys" class="section">
<h2>License Keys</h2>
<div class="grid">
  <div class="card" onclick="openDailyKey()">
    <h3>Daily Free Key</h3>
    <p>Unlock today’s key</p>
  </div>
  <div class="card">
    <h3>Premium Keys</h3>
    <p>Premium access</p>
  </div>
</div>
</section>

<footer>© 2026 PoloX Scripts</footer>

<script>
function goHome(){
  window.scrollTo({top:0,behavior:"smooth"});
}

  document.getElementById(id).scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
