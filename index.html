<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoloX Scripts</title>

<link rel="icon" type="image/jpeg" href="photo_2026-02-13_00-21-40-fotor-2026021312851.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --bg:#000;
  --border:#1f1f1f;
  --text:#fff;
  --muted:#aaa;
  --green:#16ff00;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:radial-gradient(circle at top,#111,#000 65%);color:var(--text)}

/* NAVBAR */
header{
position:fixed;top:0;left:0;width:100%;height:95px;
padding:0 32px;display:grid;
grid-template-columns:auto 1fr auto;
align-items:center;background:rgba(0,0,0,.9);
border-bottom:1px solid var(--border);
z-index:1000;
}
.nav-left{display:flex;align-items:center;gap:22px}
.nav-left a{color:var(--muted);font-size:19px;font-weight:600;cursor:pointer;text-decoration:none}
.nav-left a:hover{color:#fff}
.nav-logo{height:44px;cursor:pointer}
.logo{text-align:center;font-size:24px;font-weight:bold;letter-spacing:3px}
.nav-right{display:flex;align-items:center;gap:26px}
.socials{display:flex;gap:22px}
.socials a{color:#fff;font-size:22px}

/* Sound toggle */
.toggle{
  border:1px solid var(--border);
  padding:7px 16px;
  border-radius:22px;
  font-size:14px;
  cursor:pointer;
}

@media(max-width:768px){
header{height:auto;padding:15px;grid-template-columns:1fr;text-align:center}
.nav-left{flex-wrap:wrap;justify-content:center}
.nav-right{flex-direction:column}
}

/* HOME */
#home{min-height:100vh;padding-top:140px;display:flex;align-items:center;justify-content:center;text-align:center}
.home-inner{max-width:900px}
.home-inner h1{font-size:52px;margin-bottom:12px}
.home-inner p{color:var(--muted);font-size:18px}
.video-box{margin:35px auto 0;max-width:880px;aspect-ratio:16/9;border-radius:26px;overflow:hidden;border:1px solid var(--border)}
.video-box iframe{width:100%;height:100%}

/* SECTIONS */
.section{max-width:1150px;margin:auto;padding:100px 20px}
.section h2{text-align:center;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:25px}

/* CARDS */
.card{
background:linear-gradient(145deg,#0a0a0a,#000);
border:1px solid var(--border);
padding:25px;border-radius:20px;
cursor:pointer;transition:.3s;
}
.card:hover{
border-color:#fff;
box-shadow:0 0 18px rgba(255,255,255,.3);
}
.card p{color:var(--muted)}

/* MODAL */
.modal{
position:fixed;inset:0;background:rgba(0,0,0,.9);
display:none;align-items:center;justify-content:center;
z-index:9999;
}
.modal.active{display:flex}
.modal-box{
width:92%;max-width:480px;background:#000;
border:1px solid var(--border);
border-radius:24px;padding:30px;text-align:center;position:relative;
}
.close{position:absolute;top:14px;right:18px;font-size:22px;color:#aaa;cursor:pointer}
.progress{height:10px;background:#222;border-radius:20px;overflow:hidden;margin:15px 0}
#bar,#eventBarNew{height:100%;width:0%;background:#fff;transition:.4s}
.step{display:block;background:#fff;color:#000;padding:14px;margin:10px 0;border-radius:18px;font-weight:bold;text-decoration:none}
.step.done{background:var(--green)}
.step.done::after{content:"✓";float:right}
button{width:100%;padding:14px;border:none;border-radius:18px;background:#fff;font-weight:bold;opacity:.4}
button.active{opacity:1;cursor:pointer}

.event-btn{
  opacity:1 !important;
  background:#fff;
  color:#000;
  cursor:pointer;
  transition:0.3s;
}
.event-btn:hover{background:#eaeaea}
.event-btn:disabled{
  background:#555;
  color:#ccc;
  cursor:not-allowed;
}

footer{text-align:center;padding:40px;border-top:1px solid var(--border);color:#666}
</style>
</head>

<body>

<!-- 🎵 BACKGROUND MUSIC (NEW, HECH NARSA O'ZGARMADI) -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<header>
<div class="nav-left">
<img src="photo_2026-02-13_00-21-40.jpg" class="nav-logo" onclick="goHome()">
<a onclick="goHome()">Home</a>
<a onclick="scrollToSec('scripts')">Scripts</a>
<a onclick="scrollToSec('keys')">Keys</a>
<a onclick="scrollToSec('robux')">Robux</a>
</div>
<div class="logo">PoloX Scripts</div>
<div class="nav-right">
<div class="socials">
<a href="https://www.youtube.com/@PoloX_script" target="_blank"><i class="fab fa-youtube"></i></a>
<a href="https://www.instagram.com/polo_bro.7p" target="_blank"><i class="fab fa-instagram"></i></a>
<a href="https://t.me/eventpolo" target="_blank"><i class="fab fa-telegram"></i></a>
<a href="https://discord.gg/SENING_DISCORD" target="_blank"><i class="fab fa-discord"></i></a>
</div>

<!-- SOUND TOGGLE QO‘SHILDI -->
<div class="toggle" id="soundToggle">Sound: OFF</div>

</div>
</header>

<!-- QOLGAN KODING 100% O'ZGARMAGAN -->
<script>
const bgMusic = document.getElementById("bgMusic");
const soundBtn = document.getElementById("soundToggle");

if(bgMusic){
  bgMusic.volume = 0.4;
}

let playing = false;

if(soundBtn){
  soundBtn.addEventListener("click", () => {

    if(!playing){
      bgMusic.play();
      soundBtn.innerText = "Sound: ON";
      playing = true;
    } else {
      bgMusic.pause();
      soundBtn.innerText = "Sound: OFF";
      playing = false;
    }

  });
}
</script>
